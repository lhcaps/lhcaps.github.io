<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111521"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8BC34A" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8BC34A"/>
      <stop offset="80%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent-line)"/>

  <!-- Left vertical accent -->
  <rect x="60" y="80" width="2" height="480" fill="#8BC34A" opacity="0.3"/>

  <!-- Name -->
  <text x="100" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#f0f0f0" letter-spacing="-1">Le Huy</text>

  <!-- Role -->
  <text x="100" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#8BC34A" font-weight="500" letter-spacing="1">BACKEND-HEAVY FULL-STACK DEVELOPER</text>

  <!-- Divider -->
  <line x1="100" y1="250" x2="500" y2="250" stroke="#8BC34A" stroke-width="1" opacity="0.4"/>

  <!-- Stack tags -->
  <text x="100" y="295" font-family="monospace" font-size="14" fill="#888" letter-spacing="1">React · TypeScript · Node.js · FastAPI · SQL · Docker</text>

  <!-- Projects section -->
  <text x="100" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#666" letter-spacing="2">SELECTED PROJECTS</text>

  <!-- Project cards -->
  <!-- Parkly -->
  <rect x="100" y="380" width="300" height="70" rx="12" fill="#1a1d2e" stroke="#8BC34A" stroke-width="1" stroke-opacity="0.25"/>
  <text x="120" y="408" font-family="monospace" font-size="13" fill="#8BC34A" font-weight="600">01</text>
  <text x="150" y="408" font-family="system-ui, sans-serif" font-size="16" fill="#e0e0e0" font-weight="600">Parkly</text>
  <text x="150" y="430" font-family="monospace" font-size="11" fill="#777">Gate Operations Platform</text>

  <!-- VisionFlow -->
  <rect x="420" y="380" width="300" height="70" rx="12" fill="#1a1d2e" stroke="#4CAF50" stroke-width="1" stroke-opacity="0.25"/>
  <text x="440" y="408" font-family="monospace" font-size="13" fill="#4CAF50" font-weight="600">02</text>
  <text x="470" y="408" font-family="system-ui, sans-serif" font-size="16" fill="#e0e0e0" font-weight="600">VisionFlow Studio</text>
  <text x="470" y="430" font-family="monospace" font-size="11" fill="#777">CV Workflow Platform</text>

  <!-- TFT -->
  <rect x="740" y="380" width="300" height="70" rx="12" fill="#1a1d2e" stroke="#7986CB" stroke-width="1" stroke-opacity="0.25"/>
  <text x="760" y="408" font-family="monospace" font-size="13" fill="#7986CB" font-weight="600">03</text>
  <text x="790" y="408" font-family="system-ui, sans-serif" font-size="16" fill="#e0e0e0" font-weight="600">TFT Local Copilot</text>
  <text x="790" y="430" font-family="monospace" font-size="11" fill="#777">Local RAG Assistant</text>

  <!-- Bottom bar -->
  <rect x="0" y="490" width="1200" height="140" fill="#0d0f1a"/>
  <rect x="0" y="490" width="1200" height="1" fill="#8BC34A" opacity="0.2"/>

  <!-- Status dot -->
  <circle cx="130" cy="530" r="5" fill="#8BC34A"/>
  <text x="145" y="535" font-family="system-ui, sans-serif" font-size="14" fill="#888">Available for internships</text>

  <!-- Links -->
  <text x="600" y="535" font-family="monospace" font-size="13" fill="#555">github.com/lhcaps</text>
  <text x="850" y="535" font-family="monospace" font-size="13" fill="#555">lhcaps.github.io</text>

  <!-- CTA -->
  <rect x="100" y="555" width="160" height="36" rx="18" fill="#8BC34A"/>
  <text x="130" y="578" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0a0c14">View Projects ’</text>

  <rect x="280" y="555" width="140" height="36" rx="18" fill="none" stroke="#8BC34A" stroke-width="1" stroke-opacity="0.5"/>
  <text x="305" y="578" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#8BC34A">Download CV</text>

  <!-- Location -->
  <text x="1000" y="535" font-family="monospace" font-size="12" fill="#555">HCMC, Vietnam</text>
</svg>
